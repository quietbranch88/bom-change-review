<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Evidence-based BOM Change Review architecture</title>
<desc id="desc">Top: immutable JSON, SQLite sync ledger, Neo4j projection and explicit recovery. Bottom: bounded demo admission, Agent controls and read-only MCP. Orange marks synthetic boundaries; purple dashed lines mark pending model integration.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506680"/></marker></defs>
<rect width="1440" height="900" fill="#f3f6fa"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172d46">
<text x="64" y="63" font-size="30" font-weight="700">Evidence-based BOM Change Review</text>
<text x="64" y="98" font-size="18">Traceable evidence · Actionable gaps · Explicit recovery · Bounded demo tasks</text>
<rect x="48" y="128" width="1344" height="324" rx="20" fill="white" stroke="#dce4ee"/>
<text x="72" y="166" font-size="22" font-weight="700">Evidence and projection sync</text>
<rect x="78" y="196" width="244" height="104" rx="12" fill="#fff2d8" stroke="#d5a955"/>
<text x="98" y="230" font-size="17" font-weight="700">Public evidence + fixtures</text>
<text x="98" y="262" font-size="15">Simulated review and wiring</text>
<rect x="370" y="196" width="244" height="104" rx="12" fill="#e5effc" stroke="#6994c2"/>
<text x="390" y="230" font-size="17" font-weight="700">Immutable JSON versions</text>
<text x="390" y="262" font-size="15">Source of truth; retain history</text>
<rect x="662" y="196" width="244" height="104" rx="12" fill="#e5effc" stroke="#6994c2"/>
<text x="682" y="230" font-size="17" font-weight="700">SQLite sync ledger</text>
<text x="682" y="262" font-size="16">pending / failed / synced</text>
<rect x="1010" y="196" width="320" height="104" rx="12" fill="#e4f3ea" stroke="#75a98b"/>
<text x="1030" y="230" font-size="17" font-weight="700">Versioned Neo4j projection</text>
<text x="1030" y="262" font-size="15">Independent complete readback</text>
<g fill="none" stroke="#506680" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M322 247H362"/><path d="M614 247H654"/><path d="M906 247H1002"/>
<path d="M1160 300V362H786V308"/>
</g>
<text x="922" y="227" font-size="14">Import</text>
<text x="884" y="389" font-size="16">Mark synced only after an exact match</text>
<text x="78" y="350" font-size="17">Lost acknowledgment: graph may be committed; job stays failed</text>
<text x="78" y="382" font-size="17">Explicit retry: re-import, verify readback, and keep old evidence</text>
<text x="78" y="418" font-size="15" fill="#62758a">Default graph is fake; separate isolated tests exercise real Neo4j and SQLite</text>
<rect x="48" y="474" width="1344" height="324" rx="20" fill="white" stroke="#dce4ee"/>
<text x="72" y="512" font-size="22" font-weight="700">Queries and concurrent demo tasks</text>
<rect x="78" y="546" width="244" height="104" rx="12" fill="#fff2d8" stroke="#d5a955"/>
<text x="98" y="580" font-size="17" font-weight="700">Synthetic case access</text>
<text x="98" y="612" font-size="15">Separate data for each task</text>
<rect x="370" y="546" width="244" height="104" rx="12" fill="#e5effc" stroke="#6994c2"/>
<text x="390" y="580" font-size="17" font-weight="700">Bounded FIFO admission</text>
<text x="390" y="612" font-size="15">2 active · 4 waiting</text>
<rect x="662" y="546" width="244" height="104" rx="12" fill="#e5effc" stroke="#6994c2"/>
<text x="682" y="580" font-size="17" font-weight="700">Agent controller</text>
<text x="682" y="612" font-size="15">Tool / snapshot / call / citation</text>
<rect x="1010" y="546" width="320" height="104" rx="12" fill="#e4f3ea" stroke="#75a98b"/>
<text x="1030" y="580" font-size="17" font-weight="700">Read-only MCP tools</text>
<text x="1030" y="612" font-size="15">Specifications · Gaps · Evidence</text>
<g fill="none" stroke="#506680" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M322 598H362"/><path d="M614 598H654"/><path d="M906 598H1002"/>
<path d="M1170 546V464H1360V247H1338"/>
</g>
<rect x="662" y="692" width="244" height="70" rx="12" fill="#fff2d8" stroke="#d5a955"/>
<text x="682" y="722" font-size="17" font-weight="700">Current: scripted planner</text>
<text x="682" y="745" font-size="14">Synthetic tool delays in demo</text>
<path d="M785 692V658" fill="none" stroke="#506680" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1010" y="692" width="320" height="70" rx="12" fill="#f0eafa" stroke="#9577b9" stroke-dasharray="7 5"/>
<text x="1030" y="722" font-size="17" font-weight="700">Pending: OpenRouter model</text>
<text x="1030" y="745" font-size="14">Real budgets, provider usage, evals</text>
<path d="M1010 726H944V664H820V650" fill="none" stroke="#9577b9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="78" y="695" font-size="17">Return busy at capacity · Stop at queue deadline</text>
<text x="78" y="728" font-size="17">Clean up permits on cancellation · No shared current case</text>
<text x="78" y="761" font-size="15" fill="#62758a">Real MCP/DB tested separately; concurrency results are not production capacity</text>
<text x="64" y="836" font-size="17">Blue: implemented controls · Green: data interfaces · Orange: synthetic boundary · Purple dashed: pending</text>
<text x="64" y="868" font-size="16" fill="#62758a">Scope: recommended BIAS voltage only; source facts pending; every outcome still requires engineering review</text>
</g></svg>
